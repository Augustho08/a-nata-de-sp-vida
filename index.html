<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Players</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
    padding:15px;
}

@media(min-width:768px){

}

.topbar{
    display:flex;

}

.nav-buttons{

}

.nav-btn{

.nav-btn:hover{

}

.nav-btn.active{

}

.nav-btn.inactive{

    color:#31d06c;

}

.logo h1{

}

@media(min-width:768px){

        font-size:38px;
    }
}

.logo p{

}

.online-box{

    border:1px solid #2a2a2a;

    padding:10px 16px;
}

@media(min-width:768px){
    .online-box{
        border-radius:18px;
        padding:14px 22px;
    }
}

.online-box span{
    color:#8a8a8a;
    font-size:12px;
}

.online-box h2{
    margin-top:4px;

}

@media(min-width:768px){

    }
}

.players{
    display:none;
    grid-template-columns:1fr;
    gap:12px;
}

.players.active{
    display:grid;
}

@media(min-width:640px){
    .players{
        grid-template-columns:repeat(2,1fr);
        gap:14px;
    }
}

@media(min-width:1024px){
    .players{

.card{
    background:#161616;
    border:1px solid #2a2a2a;
    border-radius:16px;
    padding:14px;
    transition:0.3s ease;
    animation:slideIn 0.5s ease-out;
}

@media(min-width:768px){

        border-radius:22px;
        padding:18px;
    }
}

.card:hover{
    transform:translateY(-4px);
    border-color:#31d06c;
    box-shadow:0 8px 16px rgba(49,208,108,0.1);
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{

        transform:translateY(0);
    }
}

.player-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.player-head img{
    width:60px;
    height:60px;
    border-radius:14px;

    flex-shrink:0;
}

@media(min-width:768px){
    .player-head{

    }
    
    .player-head img{

.player-name{

}

@media(min-width:768px){

    }
}

.player-id{

}

@media(min-width:768px){

        font-size:14px;
    }
}

.info{
    background:#242424;
    border-radius:12px;
    padding:10px;
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

@media(min-width:768px){

        border-radius:14px;

        margin-top:10px;
    }
}

.info span{

}

@media(min-width:768px){
    .info span{

    }
}

.respect{
    color:#31d06c;
    font-weight:bold;
    font-size:14px;
}

@media(min-width:768px){
    .respect{
        font-size:16px;
    }
}

.loading{
    text-align:center;
    padding:40px 20px;
    color:#878787;
    font-size:16px;
    grid-column:1/-1;
}

@media(min-width:640px){
    .loading{
        padding:60px 20px;
        font-size:18px;
    }
}

.loader{
    display:inline-block;
    margin:20px 0;
}

.spinner{
    width:50px;
    height:50px;
    border:4px solid #2a2a2a;
    border-top:4px solid #31d06c;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}

.card-vip{
    background:linear-gradient(135deg, #1a2a1a 0%, #161616 100%);
    border:2px solid #31d06c !important;
    position:relative;
    overflow:hidden;
}

.card-vip::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:linear-gradient(90deg, transparent, #31d06c, transparent);
    animation:shimmer 2s infinite;
}

@keyframes shimmer{
    0%, 100%{
        transform:translateX(-100%);
    }
    50%{
        transform:translateX(100%);
    }
}

.card-vip:hover{
    border-color:#31d06c;
    box-shadow:0 0 20px rgba(49,208,108,0.3), 0 8px 16px rgba(49,208,108,0.1);

}

.vip-badge{

}

    color:#4f4f4f;

@media(min-width:768px){

}

.leaderboard-table.active{

}

    justify-items:center;

@media(min-width:640px){

}

    position:relative;
}

.medal{

    margin-bottom:10px;
    display:block;
}

.podium-card.second .medal{
    font-size:42px;
    color:#c0c0c0;
}

.podium-card.first .medal{
    font-size:54px;
    color:#ffd700;
    animation:bounce 1s ease-in-out infinite;
}

.podium-card.third .medal{
    font-size:42px;
    color:#cd7f32;
}

@keyframes bounce{
    0%, 100%{
        transform:translateY(0);
    }

        transform:translateY(-10px);
    }
}

.podium-info{
    background:#1a1a1a;
    border:2px solid #31d06c;
    border-radius:14px;
    padding:15px;
    margin-top:10px;
}

.podium-card.second .podium-info,
.podium-card.third .podium-info{

}

.podium-rank{
    font-size:28px;
    font-weight:bold;
    color:#31d06c;
    margin-bottom:8px;
}

.podium-card.second .podium-rank{
    color:#c0c0c0;
}

.podium-card.third .podium-rank{

}

.podium-avatar{

.podium-card.second .podium-avatar,

}

.podium-name{

    word-break:break-word;
    margin-bottom:5px;
}

.podium-respect{

    font-size:14px;
    font-weight:bold;
}

.top100-list{

}

.top100-list.active{
    display:block;
}

.leaderboard-row{

.rank-badge{

.leaderboard-row.top3 .rank-badge{

.leaderboard-row.top3{

.player-info-row{

}

.player-avatar-small{

@media(min-width:768px){

}

.player-details-row{

.player-name-row{

@media(min-width:768px){
    .player-name-row{
        font-size:16px;
    }
}

.player-id-row{
    font-size:11px;
    color:#7f7f7f;
}

@media(min-width:768px){
    .player-id-row{
        font-size:12px;

.level-badge{
    background:#242424;
    padding:6px 12px;
    border-radius:8px;
    font-size:12px;
    text-align:center;

@media(min-width:768px){

    }

.respect-value{

/* ANIMAÇÕES DE MUDANÇA */
@keyframes newPlayer{
    0%{
        background:#1a2a1a;
        border-color:#31d06c;
        transform:scale(0.95);
    }
    50%{
        box-shadow:0 0 20px rgba(49,208,108,0.5);
    }
    100%{
        background:#161616;
        border-color:#2a2a2a;
        transform:scale(1);
    }
}

@keyframes updated{
    0%{
        border-color:#ffd700;
        box-shadow:0 0 15px rgba(255,215,0,0.4);
    }
    100%{
        border-color:#2a2a2a;
        box-shadow:none;
    }
}

@keyframes respectPulse{
    0%{
        color:#ff6b6b;
    }
    50%{
        color:#31d06c;
        transform:scale(1.15);
    }
    100%{
        color:#31d06c;
        transform:scale(1);
    }
}

@keyframes positionChange{
    0%{
        background:#1a2a1a;
    }
    100%{
        background:#161616;
    }
}

.badge-new{
    position:absolute;
    top:8px;
    left:8px;
    background:#31d06c;
    color:#0b0b0b;
    padding:4px 10px;
    border-radius:6px;
    font-size:10px;
    font-weight:bold;
    z-index:5;
    animation:pulse 0.8s ease-in-out infinite;
}

.card.new{
    animation:newPlayer 0.6s ease-out !important;
    border:2px solid #31d06c !important;
    position:relative;
}

.card.updated{
    animation:updated 1.2s ease-out !important;
}

.respect-updated{
    animation:respectPulse 0.8s ease-out !important;
}

.rank-updated{
    animation:positionChange 1s ease-out !important;
}

.status-indicator{
    position:fixed;
    top:15px;
    right:15px;
    background:#31d06c;
    color:#0b0b0b;
    padding:12px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    z-index:1000;
    animation:slideDown 0.4s ease-out;
}

@keyframes slideDown{
    from{
        transform:translateY(-30px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

</style>

</head>

<body>

<div class="topbar">

    <div class="logo">
        <h1>PAINEL</h1>
        <p id="topbar-subtitle">Players online</p>
    </div>

    <div style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
        <div class="nav-buttons">
            <button class="nav-btn active" id="btn-online" onclick="showOnline()">Online</button>
            <button class="nav-btn inactive" id="btn-top100" onclick="showTop100()">Top 100</button>
        </div>
        <div class="online-box">
            <span id="subtitle-box">ONLINE</span>
            <h2 id="online">0</h2>
        </div>
    </div>

</div>

<!-- VIEW: ONLINE PLAYERS -->
<div id="view-online" class="players active" id="players">

    <div class="loading">
        <div class="loader">
            <div class="spinner"></div>
        </div>
        carregando players...
    </div>

</div>

<!-- VIEW: TOP 100 LEADERBOARD -->
<div id="view-top100" class="leaderboard-table">
    <div id="podium" class="podium"></div>
    <div id="top100-list" class="top100-list active"></div>
</div>

<div class="watermark">
    VRAU NELAS RX86
</div>

<script>

// VARIÁVEIS GLOBAIS PARA MONITORAMENTO
let previousPlayers = [];
let previousTop100 = [];

// MOSTRAR NOTIFICAÇÃO
function showNotification(message){
    const notif = document.createElement("div");
    notif.className = "status-indicator";
    notif.innerText = message;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
}

// COMPARAR DADOS E DETECTAR MUDANÇAS
function detectPlayerChanges(newPlayers){
    const changes = {
        new: [],
        removed: [],
        updated: []
    };

    const newIds = new Set(newPlayers.map(p => p.id));
    const oldIds = new Set(previousPlayers.map(p => p.id));

    // NOVOS PLAYERS
    newPlayers.forEach(p => {
        if(!oldIds.has(p.id)){
            changes.new.push(p);
        }
    });

    // PLAYERS REMOVIDOS
    previousPlayers.forEach(p => {
        if(!newIds.has(p.id)){
            changes.removed.push(p);
        }
    });

    // PLAYERS ATUALIZADOS (mudança de respect ou level)
    newPlayers.forEach(newP => {
        const oldP = previousPlayers.find(p => p.id === newP.id);
        if(oldP && (oldP.respect !== newP.respect || oldP.level !== newP.level)){
            changes.updated.push({new: newP, old: oldP});
        }
    });

    return changes;
}

function detectRankingChanges(newPlayers){
    const changes = {
        new: [],
        positionChanged: []
    };

    const newIds = new Set(newPlayers.map(p => p.id));
    const oldIds = new Set(previousTop100.map(p => p.id));

    // NOVOS NO TOP 100
    newPlayers.forEach(p => {
        if(!oldIds.has(p.id)){
            changes.new.push(p);
        }
    });

    // MUDANÇAS DE POSIÇÃO
    newPlayers.forEach((newP, newIdx) => {
        const oldP = previousTop100.find(p => p.id === newP.id);
        if(oldP){
            const oldIdx = previousTop100.indexOf(oldP);
            if(oldIdx !== newIdx){
                changes.positionChanged.push({
                    player: newP,
                    oldPos: oldIdx + 1,
                    newPos: newIdx + 1
                });
            }
        }
    });

    return changes;
}

// FUNÇÕES DE NAVEGAÇÃO
function showOnline(){
    document.getElementById("view-online").classList.add("active");
    document.getElementById("view-top100").classList.remove("active");
    document.getElementById("btn-online").classList.add("active");
    document.getElementById("btn-online").classList.remove("inactive");
    document.getElementById("btn-top100").classList.remove("active");
    document.getElementById("btn-top100").classList.add("inactive");
    document.getElementById("topbar-subtitle").innerText = "Players online";
    document.getElementById("subtitle-box").innerText = "ONLINE";
}

function showTop100(){
    document.getElementById("view-online").classList.remove("active");
    document.getElementById("view-top100").classList.add("active");
    document.getElementById("btn-online").classList.remove("active");
    document.getElementById("btn-online").classList.add("inactive");
    document.getElementById("btn-top100").classList.add("active");
    document.getElementById("btn-top100").classList.remove("inactive");
    document.getElementById("topbar-subtitle").innerText = "Top 100 Ranking";
    document.getElementById("subtitle-box").innerText = "RANKING";
    document.getElementById("online").innerText = "100";
    loadTop100();
}

// CARREGA PLAYERS ONLINE
async function loadPlayers(){

    try{

        const req = await fetch(
            "https://corsproxy.io/?https://api.crime.life/online/players"
        );

        const json = await req.json();

        const players = json.data.players;

        // DETECTAR MUDANÇAS
        const changes = detectPlayerChanges(players);

        const playersDiv = document.getElementById("view-online");

        document.getElementById("online").innerText = players.length;

        playersDiv.innerHTML = "";

        players.forEach((player, index) => {

            const card = document.createElement("div");
            const isVIP = player.username === "VrauRX86";
            const isNew = changes.new.some(p => p.id === player.id);
            const isUpdated = changes.updated.some(p => p.new.id === player.id);
            
            card.className = isVIP ? "card card-vip" : "card";
            if(isNew) card.classList.add("new");
            if(isUpdated) card.classList.add("updated");
            
            card.style.animationDelay = (index * 50) + "ms";
            card.style.position = "relative";

            const respectChange = isUpdated ? changes.updated.find(p => p.new.id === player.id) : null;

            card.innerHTML = `
                ${isVIP ? '<div class="vip-badge">👑 OWNER </div>' : ''}
                ${isNew ? '<div class="badge-new">🆕 NEW</div>' : ''}
                <div class="player-head">
                    <img src="${player.avatar}" alt="${player.username}">
                    <div>
                        <div class="player-name">${player.username}</div>
                        <div class="player-id">ID ${player.id}</div>
                    </div>
                </div>

                <div class="info">
                    <span>Level</span>
                    <strong>${player.level}${respectChange && respectChange.old.level !== player.level ? ' ⬆️' : ''}</strong>
                </div>

                <div class="info">
                    <span>Respect</span>
                    <strong class="respect ${respectChange ? 'respect-updated' : ''}">${Number(player.respect).toLocaleString("pt-BR")}${respectChange && respectChange.old.respect !== player.respect ? ' ⬆️' : ''}</strong>
                </div>
            `;

            playersDiv.appendChild(card);

        });

        // MOSTRAR NOTIFICAÇÕES DE MUDANÇA
        if(changes.new.length > 0){
            showNotification(`🆕 ${changes.new.length} novo(s) player(s) online!`);
        }
        if(changes.removed.length > 0){
            showNotification(`👋 ${changes.removed.length} player(s) offline`);
        }
        if(changes.updated.length > 0){
            showNotification(`📈 ${changes.updated.length} player(s) atualizados!`);
        }

        previousPlayers = JSON.parse(JSON.stringify(players));

    }catch(e){

        console.log(e);

        document.getElementById("view-online").innerHTML = `
            <div class="loading">
                <div style="color:#d06c6c; margin-bottom:10px;">⚠️ Erro ao carregar</div>
                Falha na conexão com a API
            </div>
        `;

    }

}

// CARREGA TOP 100
async function loadTop100(){

    try{

        const req = await fetch(
            "https://corsproxy.io/?https://api.crime.life/leaderboard/top100"
        );

        const json = await req.json();

        const players = json.data.players;

        // DETECTAR MUDANÇAS
        const changes = detectRankingChanges(players);

        const podiumDiv = document.getElementById("podium");
        const listDiv = document.getElementById("top100-list");

        podiumDiv.innerHTML = "";
        listDiv.innerHTML = "";

        // TOP 3 - PÓDIO
        const top3 = players.slice(0, 3);
        const order = [0, 1, 2]; // 1º lugar, 2º lugar, 3º lugar

        top3.forEach((player, idx) => {
            const position = idx + 1;
            const medalMap = {1: "🥇", 2: "🥈", 3: "🥉"};
            const isNew = changes.new.some(p => p.id === player.id);
            const posChanged = changes.positionChanged.find(p => p.player.id === player.id);
            
            const card = document.createElement("div");
            card.className = position === 1 ? "podium-card first" : position === 2 ? "podium-card second" : "podium-card third";
            if(posChanged) card.classList.add("rank-updated");

            card.innerHTML = `
                <span class="medal">${medalMap[position]}</span>
                ${isNew ? '<div class="badge-new">🆕 NOVO!</div>' : ''}
                <img src="${player.avatar}" alt="${player.username}" class="podium-avatar">
                <div class="podium-info">
                    <div class="podium-rank">#${position}${posChanged ? ` (era #${posChanged.oldPos})` : ''}</div>
                    <div class="podium-name">${player.username}</div>
                    <div style="font-size:11px; color:#7f7f7f; margin-bottom:8px;">ID ${player.id}</div>
                    <div style="background:#242424; padding:8px; border-radius:6px; margin-bottom:8px;">
                        <div style="font-size:11px; color:#979797;">Level</div>
                        <div style="font-weight:bold;">${player.level}</div>
                    </div>
                    <div style="font-size:12px; color:#7f7f7f; margin-bottom:5px;">Respect</div>
                    <div class="podium-respect">${Number(player.respect).toLocaleString("pt-BR")}</div>
                </div>
            `;

            podiumDiv.appendChild(card);
        });

        // RESTO (4-100)
        players.slice(3).forEach((player, idx) => {
            const position = idx + 4;
            const isNew = changes.new.some(p => p.id === player.id);
            const posChanged = changes.positionChanged.find(p => p.player.id === player.id);
            
            const row = document.createElement("div");
            row.className = "leaderboard-row";
            if(isNew) row.classList.add("new");
            if(posChanged) row.classList.add("rank-updated");

            row.innerHTML = `
                <div class="rank-badge">#${position}${posChanged ? ` (${posChanged.oldPos > position ? '⬆️' : '⬇️'})` : ''}</div>
                <div class="player-info-row">
                    <img src="${player.avatar}" alt="${player.username}" class="player-avatar-small">
                    <div class="player-details-row">
                        <div class="player-name-row">${player.username}${isNew ? ' 🆕' : ''}</div>
                        <div class="player-id-row">ID ${player.id}</div>
                    </div>
                </div>
                <div class="level-badge">Lv ${player.level}</div>
                <div class="respect-value">${Number(player.respect).toLocaleString("pt-BR")}</div>
            `;

            listDiv.appendChild(row);
        });

        // MOSTRAR NOTIFICAÇÕES
        if(changes.new.length > 0){
            showNotification(`🆕 ${changes.new.length} novo(s) no Top 100!`);
        }
        if(changes.positionChanged.length > 0){
            const climbed = changes.positionChanged.filter(p => p.oldPos > p.newPos).length;
            const dropped = changes.positionChanged.filter(p => p.oldPos < p.newPos).length;
            if(climbed > 0) showNotification(`📈 ${climbed} subiu(ram) no ranking!`);
            if(dropped > 0) showNotification(`📉 ${dropped} desceu(ram) no ranking!`);
        }

        previousTop100 = JSON.parse(JSON.stringify(players));

    }catch(e){

        console.log(e);

        document.getElementById("view-top100").innerHTML = `
            <div class="loading">
                <div style="color:#d06c6c; margin-bottom:10px;">⚠️ Erro ao carregar</div>
                Falha ao conectar no ranking
            </div>
        `;

    }

}

loadPlayers();

// Recarrega a cada 10 segundos com detecção de mudanças
setInterval(loadPlayers, 10000);

</script>

</html>
