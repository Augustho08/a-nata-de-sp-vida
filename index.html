<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crime Life</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0c0c0c;
    color:white;
    padding:25px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.logo h1{
    font-size:38px;
}

.logo p{
    color:#777;
    margin-top:5px;
}

.online{
    background:#161616;
    border:1px solid #2a2a2a;
    border-radius:18px;
    padding:14px 22px;
}

.online span{
    color:#888;
    font-size:14px;
}

.online h2{
    margin-top:5px;
    font-size:32px;
}

.players{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.card{
    background:#161616;
    border:1px solid #2a2a2a;
    border-radius:22px;
    padding:18px;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.player{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
}

.player img{
    width:80px;
    height:80px;
    border-radius:18px;
    object-fit:cover;
}

.name{
    font-size:22px;
}

.id{
    color:#777;
    margin-top:4px;
    font-size:14px;
}

.info{
    background:#252525;
    border-radius:14px;
    padding:12px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
}

.info span{
    color:#9b9b9b;
}

.respect{
    color:#2fd36d;
    font-weight:bold;
}

.loading{
    text-align:center;
    color:#888;
    padding:60px;
    font-size:20px;
}

.mark{
    text-align:center;
    margin-top:35px;
    color:#444;
    font-size:13px;
    letter-spacing:2px;
}

</style>

</head>

<body>

<div class="topo">

    <div class="logo">
        <h1>Crime Life</h1>
        <p>players online</p>
    </div>

    <div class="online">
        <span>ONLINE</span>
        <h2 id="online">0</h2>
    </div>

</div>

<div class="players" id="players">

    <div class="loading">
        carregando...
    </div>

</div>

<div class="mark">
    VRAU NELAS RX86
</div>

<script>

async function loadPlayers(){

    try{

        const req = await fetch("/api/players");

        const json = await req.json();

        const players = json.data.players;

        document.getElementById("online").innerText = players.length;

        const div = document.getElementById("players");

        div.innerHTML = "";

        players.forEach(player => {

            div.innerHTML += `

            <div class="card">

                <div class="player">

                    <img src="${player.avatar}">

                    <div>

                        <div class="name">
                            ${player.username}
                        </div>

                        <div class="id">
                            ID ${player.id}
                        </div>

                    </div>

                </div>

                <div class="info">
                    <span>Level</span>
                    <strong>${player.level}</strong>
                </div>

                <div class="info">
                    <span>Respect</span>

                    <strong class="respect">
                        ${Number(player.respect).toLocaleString("pt-BR")}
                    </strong>
                </div>

            </div>

            `;

        });

    }catch(err){

        console.log(err);

        document.getElementById("players").innerHTML = `
        
            <div class="loading">
                erro ao carregar players
            </div>

        `;

    }

}

loadPlayers();

</script>

</body>

</html>
